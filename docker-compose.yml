# ============================================================
#  docker-compose.yml — pfe-management (Lab DevSecOps local)
# ============================================================

services:

  # ── MongoDB ───────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: mydb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Backend Express ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      MONGO_URI: mongodb://admin:password123@mongodb:27017/mydb?authSource=admin
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: supersecretkey123
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
      UPLOAD_PATH: ./uploads
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  # ── Frontend React (Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5001
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

# ── Volumes persistants ───────────────────────────────────
volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local

# ── Réseau interne ────────────────────────────────────────
networks:
  default:
    name: pfe-network
    driver: bridge